<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="containerPrincipal">
        <form action="home.html">
            <button class="btn-voltar"><img src="../assets/icon/arrow-narrow-left-svgrepo-com.svg" alt="voltar">VOLTAR AO INÍCIO</button>
        </form>

        <div class="containerConteudo">
            <div class="containerIMG">
                <img src="../assets/imgs/BannerCad.jpg" alt="banner">
            </div>
            <div class="containerParametros">
                <div class="titulo"><span>CRIAR CONTA</span></div>

                <div class="containerInputs">
                    <input type="text" placeholder="Nome Completo">
                    <input type="text" placeholder="Nome de Usuário">
                    <input type="text" placeholder="E-mail">
                    <div class="subcontainerInputs">
                        <input type="text" placeholder="Senha">
                        <input type="text" placeholder="Confirmar Senha">
                    </div>
                </div>
                
                <div class="containerBTN">
                    <button class="btn-continuar">ENTRAR</button>
                    <a href="./login.html">
                        <span class="subtitulo">Já tem conta? <b>Entrar</b></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
