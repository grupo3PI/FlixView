<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixView</title>
    <link rel="stylesheet" href="../css/dashboard_config.css">
</head>

<body class="pagina-config">
    <button class="menu-button" id="menuButton" aria-label="Abrir/fechar menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="index.html">
                <img src="../assets/imgs/Logo FlixView.png" alt="" />
            </a>
        </div>

        <div class="search-box">
            <input type="text" aria-label="Pesquisar" placeholder="🔍︎" />
        </div>

    <nav class="menu">

    <a href="./dashboard _inicio.html" class="menu-item menu-dashboard">
        <span class="menu-icon"></span>
        <span>Dashboard</span>
    </a>

    <a href="./dashboard_insights.html" class="menu-item menu-insights">
        <span class="menu-icon"></span>
        <span>Insights</span>
    </a>

    <a href="./dashboard_desempenho.html" class="menu-item menu-desempenho">
        <span class="menu-icon"></span>
        <span>Desempenho de Catálogo</span>
    </a>

    <a href="./dashboard_review.html" class="menu-item menu-reviews">
        <span class="menu-icon"></span>
        <span>Reviews</span>
    </a>

    <a href="./dashboard_config.html" class="menu-item menu-config">
        <span class="menu-icon"></span>
        <span>Configurações</span>
    </a>

</nav>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="dashboard-container">
            <h1>CONFIGURAÇÕES DE USUÁRIO</h1>

            <div class="titulo">
                <span>Dados da conta</span>
            </div>

            <div class="inputsClass">
                <span>Nome:</span>
                <input type="text" id="nome" placeholder="Nome do Usuário">
            </div>

            <div class="inputsClass">
                <span>Cargo:</span>
                <input type="text" id="cargo" placeholder="Cargo do Usuário">
            </div>

            <div class="inputsClass">
                <span>Email:</span>
                <input type="text" id="email" placeholder="emailuser@email.com">
            </div>

            <button onclick="salvar()" class="botao">Salvar</button>

            <div class="alterarClass">
                <span class="alterarTitulo">Alterar senha</span>

                <div class="inputsClass">
                    <input type="password" id="novaSenha" placeholder="Nova Senha">
                    <button onclick="alterTypeB(this)" class="botao-ver">⌣</button>
                </div>

                <div class="inputsClass">
                    <input type="password" id="confSenha" placeholder="Confirme a Senha">
                    <button onclick="alterTypeA(this)" class="botao-ver">⌣</button>
                </div>
            </div>

            <button onclick="alterar()" class="botao">Alterar</button>

            <div class="section">
                <img src="../assets/icon/lixeira-vermelha.png" alt="" class="image-excluir">
                <button onclick="excluirConta()" class="botao-excluir">Excluir Conta</button>
            </div>

        </div>

    </main>
</body>

</html>

<script>

    const novaSenha = document.getElementById('novaSenha');

    function alterTypeB(botao) {
    if (novaSenha.type === 'password') {
        novaSenha.type = 'text';
        botao.textContent = '👁'; 
    } else {
        novaSenha.type = 'password';
        botao.textContent = '⌣'; 
    }
}

    const confSenha = document.getElementById('confSenha');

    function alterTypeA(botao) {
    if (confSenha.type === 'password') {
        confSenha.type = 'text';
        botao.textContent = '👁'; 
    } else {
        confSenha.type = 'password';
        botao.textContent = '⌣'; 
    }
}
</script>

<script>
    const menuButton = document.getElementById("menuButton");
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("mainContent");

    menuButton.addEventListener("click", function () {
        sidebar.classList.toggle("collapsed");
        mainContent.classList.toggle("expanded");
    });
</script>
