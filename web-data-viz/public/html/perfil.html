<!DOCTYPE html>
<html lang="en">

<body>
    <header>
        <nav class="navbar">
            <div class="left">
                <img src="../assets/imgs/Logo FlixView.png" alt="">

                <a href="./home.html">Home</a>
                <a href="./home.html">Reviews</a>

            <div class="right">
                <div class="containerInput">
                    <img src="../assets/icon/lupaCinza.svg" alt="lupa">

            </div>
        </nav>
    </header>

    <main>

        <div class="containerMenu">
            <div class="titulo">MEU PERFIL</div>
            <div class="config"><button><img src="../assets/icon/settings_15990265.png" alt=""></button></div>

        <div class="containerInfo">

            <div class="titulo">MINHAS AVALIAÇÕES</div>
        </div>

        <div class="containerAvaliacoes">
            <div class="card">
                <div class="infoCard">
                    <div class="headerCard">
                        <div class="infoUser">
                            <img src="../assets/profiles/leon.jpeg">

                        </div>
                        <div class="notaUser"><img src="../assets/icon/estrela.svg" alt=""> 2.0</div>
                    </div>
                    <span class="tituloAvaliacao" id="filmeAvaliacao">Resident Evil 5: Retribuição</span>
