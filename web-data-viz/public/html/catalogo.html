<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixView — Catálogo</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>

<header class="top">
    <div class="logo"><span class="flix">FLIX</span><span class="view">VIEW</span></div>
    <nav class="primary">
        <a href="../html/home.html">Home</a>
        <a href="#">Reviews</a>
        <a href="#">Títulos</a>
    </nav>
    <div class="avatar"></div>
</header>

<main>
    <h1 class="section-title">BUSCAR TÍTULOS</h1>

    <div class="search-row">
        <input type="text" id="input_busca" placeholder="Digite o nome de um filme ou série" onkeyup="filtrarCatalogo()">
        <svg class="icon-search" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="1.8">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
    </div>

    <div class="filters">
        <select id="select_genero" onchange="filtrarCatalogo()">
            <option value="">Gênero</option>
            <option value="Ação">Ação</option>
            <option value="Drama">Drama</option>
            <option value="Ficção científica">Ficção científica</option>
            <option value="Comédia">Comédia</option>
            <option value="Terror">Terror</option>
        </select>

        <select id="select_ano" onchange="filtrarCatalogo()">
            <option value="">Ano de lançamento</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
            <option value="2016">2016</option>
            <option value="2015">2015</option>
            <option value="2014">2014</option>
            <option value="2013">2013</option>
            <option value="2012">2012</option>
            <option value="2011">2011</option>
            <option value="2010">2010</option>
            <option value="2009">2009</option>
            <option value="2008">2008</option>
            <option value="2007">2007</option>
            <option value="2006">2006</option>
            <option value="2005">2005</option>
            <option value="2004">2004</option>
            <option value="2003">2003</option>
            <option value="2002">2002</option>
            <option value="2001">2001</option>
            <option value="2000">2000</option>
            <option value="1999">1999</option>
            <option value="1998">1998</option>
            <option value="1997">1997</option>
            <option value="1996">1996</option>
            <option value="1995">1995</option>
            <option value="1994">1994</option>
            <option value="1993">1993</option>
            <option value="1992">1992</option>
            <option value="1991">1991</option>
            <option value="1990">1990</option>
            <option value="1989">1989</option>
            <option value="1988">1988</option>
            <option value="1987">1987</option>
            <option value="1986">1986</option>
            <option value="1985">1985</option>
            <option value="1984">1984</option>
            <option value="1983">1983</option>
            <option value="1982">1982</option>
            <option value="1981">1981</option>
            <option value="1980">1980</option>
        </select>

        <select id="select_popularidade" onchange="filtrarCatalogo()">
            <option value="">Popularidade</option>
            <option value="Em alta">Em alta</option>
            <option value="Mais assistidos">Mais assistidos</option>
            <option value="Recém-adicionados">Recém-adicionados</option>
        </select>

        <select id="select_avaliacao" onchange="filtrarCatalogo()">
            <option value="">Avaliação</option>
            <option value="4.5">4.5+</option>
            <option value="4.0">4.0+</option>
            <option value="3.5">3.5+</option>
        </select>
    </div>

    <p id="contador"></p>

    <div id="grid" class="grid"></div>

    <div id="vazio" class="vazio" style="display:none">
        <p>Nenhum título encontrado.</p>
    </div>
</main>

<script>

    /* Pessoal esse catalogo é temporario ate importamos os dados ... */
    var catalogo = [
        { id: 0, nome: "Stranger Things", genero: "Terror", ano: "2016", poster: "../img/Stranger-Things.jpg" },
        { id: 1, nome: "The 100", genero: "Ficção científica", ano: "2014", poster: "../img/The-100.jpg" }
    ];



    function filtrarCatalogo() {
        var termo = input_busca.value.toLowerCase();
        var genero = select_genero.value;
        var ano = select_ano.value;

        var resultado = [];

        for (var i = 0; i < catalogo.length; i++) {
            var item = catalogo[i];

            var bateNome = item.nome.toLowerCase().indexOf(termo) !== -1;
            var bateGenero = genero === "" || item.genero === genero;
            var bateAno = ano === "" || item.ano === ano;

            if (bateNome && bateGenero && bateAno) {
                resultado.push(item);
            }
        }

        mostrarResultado(resultado);
    }

    function mostrarResultado(lista) {
        if (lista.length === 0) {
            grid.style.display = "none";
            vazio.style.display = "block";
            contador.innerHTML = "";
            return;
        }

        grid.style.display = "grid";
        vazio.style.display = "none";
        contador.innerHTML = lista.length + " títulos encontrados:";

        var html = "";
        for (var i = 0; i < lista.length; i++) {
            html += cardHtml(lista[i]);
        }
        grid.innerHTML = html;
    }
    function cardHtml(item) {
        var miolo;

        if (item.poster === "") {
            miolo =
                '<svg viewBox="0 0 100 150" preserveAspectRatio="none">' +
                '<line x1="0" y1="0" x2="100" y2="150" stroke="#505050"></line>' +
                '<line x1="100" y1="0" x2="0" y2="150" stroke="#505050"></line>' +
                '</svg>';
        } else {
            miolo = '<img src="' + item.poster + '" alt="' + item.nome + '">';
        }

        return (
            '<a class="card" href="detalhes.html?id=' + item.id + '">' +
            '<div class="poster">' +
            miolo +
            '<div class="card-title">' + item.nome + '</div>' +
            '</div>' +
            '</a>'
        );
    }

    filtrarCatalogo();
</script>

</body>
</html>
