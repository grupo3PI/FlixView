
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="left">
                <a href="index.html">
                    <img src="../assets/imgs/Logo FlixView.png" alt="FlixView" class="logo">
                </a>

                <a href="index.html" class="link">Início</a>
                <a href="./catalogo.html" class="link">Títulos</a>
                <a href="./sobre.html" class="link">Sobre</a>
            </div>

            <div class="right">
                <a href="./login-cadastro.html" id="botaoCadastrar">
                    <button class="signup">Cadastrar</button>
                </a>

                <a href="./login-cadastro.html" id="botaoEntrar">
                    <button class="login">Entrar</button>
                </a>

                <button class="login" id="botaoSair" onclick="limparSessao()">
                    Sair
                </button>
            </div>

        </nav>
    </header>

    <main>

        <h1 class="section-title">BUSCAR TÍTULOS</h1>

        <div class="search-row">

            <input
                type="text"
                id="input_busca"
                placeholder="Digite o nome de um filme ou série"
            >

            <svg class="icon-search" width="16" height="16"
                viewBox="0 0 24 24" fill="none"
                stroke="#B3B3B3" stroke-width="1.8">

                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

            </svg>

        </div>

        <div class="filters">

            <select id="select_genero">
                <option value="">Gênero</option>
            </select>

            <select id="select_ano">
                <option value="">Ano de lançamento</option>
            </select>

            <select id="select_popularidade">
                <option value="">Popularidade</option>
                <option value="alta">Em alta</option>
                <option value="votados">Mais votados</option>
            </select>

            <select id="select_avaliacao">
                <option value="">Avaliação</option>
                <option value="9">9.0+</option>
                <option value="8">8.0+</option>
                <option value="7">7.0+</option>
            </select>

        </div>

        <p id="contador"></p>

        <div id="grid" class="grid"></div>

        <div id="vazio" class="vazio" style="display: none;">
            <p>Nenhum título encontrado.</p>
        </div>

    </main>

    <script src="../js/catalogo.js"></script>

</body>
</html>
